# the simple haproxy config

global
  daemon
  log 127.0.0.1 local0
  log 127.0.0.1 local1 notice
  maxconn 4096
  tune.ssl.default-dh-param 2048

defaults
  log               global
  retries           3
  maxconn           2000
  timeout connect   5s
  timeout client    50s
  timeout server    50s

listen stats
  bind 127.0.0.1:9090
  balance
  mode http
  stats enable
  stats auth admin:admin

frontend microservice_http_in
  bind *:80
  mode http

frontend microservice_http_appid_in
  bind *:81
  mode http
  acl app__accountCreationService hdr(x-microservice-app-id) -i /accountCreationService
  acl app__profileEditingService hdr(x-microservice-app-id) -i /profileEditingService
  use_backend accountCreationService_10000 if app__accountCreationService
  use_backend profileEditingService_20000 if app__profileEditingService

frontend microservice_https_in
  bind *:443 ssl crt /etc/ssl/yourCertificate
  mode http

frontend accountCreationService_10000
  bind *:10000
  mode http
  use_backend accountCreationService_10000

frontend profileEditingService_20000
  bind *:20000
  mode http
  use_backend profileEditingService_20000

backend accountCreationService_10000
  balance roundrobin
  mode http
  option forwardfor
  http-request set-header X-Forwarded-Port %[dst_port]
  http-request add-header X-Forwarded-Proto https if { ssl_fc }
  server 151_256_250_151_35800 151.256.250.151:35800

backend profileEditingService_20000
  balance roundrobin
  mode http
  option forwardfor
  http-request set-header X-Forwarded-Port %[dst_port]
  http-request add-header X-Forwarded-Proto https if { ssl_fc }
  server 151_256_250_152_35900 151.256.250.152:35900

# BEGIN ssl_options
  ssl-default-bind-ciphers EECDH+AESGCM
  ssl-default-bind-options no-sslv3 no-tlsv10
# END ssl_options

# BEGIN notes
# note line 1
# note line 2
# END notes

# BEGIN dotted_names

listen dotted_stats 127.0.0.1:9091
  mode http
  stats enable

backend dotted.backend
  mode http
  server s1 1.2.3.4:5

frontend dotted_caller
  bind *:9092
  mode http
  acl dotted.acl hdr(x-test) foo
  use_backend dotted.backend if dotted.acl

# END dotted_names

backend st_ratelimit
  stick-table type ip size 1m expire 10s store http_req_rate(10s)
  mode http

frontend st_caller
  bind *:9999
  mode http
  http-request track-sc0 src table st_ratelimit
  http-request deny deny_status 429 if { sc0_http_req_rate(st_ratelimit) gt 100 }

# --- regression: use_server rename, stick-table inline comment, duplicate ACL ---

backend srv_rename_backend
  mode http
  server srv_alpha 10.0.0.1:80
  server srv_beta 10.0.0.2:80
  use_server srv_alpha if TRUE
  use_server srv_beta if FALSE

frontend st_comment_caller
  bind *:9998
  mode http
  http-request track-sc0 src table st_ratelimit # fallback to table phantom_tbl

frontend dup_acl_caller
  bind *:9997
  mode http
  acl dup_acl hdr(x-a) foo
  acl dup_acl hdr(x-b) bar
  use_backend accountCreationService_10000 if dup_acl

# --- regression: scoped server identity & stick-match misparse ---

backend scoped_a
  mode http
  server shared 10.0.1.1:80
  use_server shared if TRUE

backend scoped_b
  mode http
  server shared 10.0.2.1:80
  use_server shared if TRUE

backend src
  stick-table type ip size 1m expire 10s store http_req_rate(10s)
  mode http
  stick match src
  stick store-request src

# --- regression: same stick-table name twice on one line ---

frontend st_twice_caller
  bind *:9996
  mode http
  http-request track-sc0 src table st_ratelimit if { sc0_http_req_rate(st_ratelimit) gt 200 }

# --- regression: inline sample whose regex contains an unbalanced literal brace ---

frontend brace_regex_caller
  bind *:9995
  mode http
  acl brace_admin_acl hdr(x-a) foo
  use_backend accountCreationService_10000 if { path_reg ^/foo\{$ } brace_admin_acl

# --- regression: cursor on fetch inside `{ ... }` must not resolve to same-named ACL ---

backend brace_cursor_target
  mode http
  server brace_cursor_srv 10.0.5.1:80

frontend brace_cursor_caller
  bind *:9994
  mode http
  acl src hdr(x-src) foo
  acl real_acl hdr(x-real) bar
  use_backend brace_cursor_target if { src 10.0.0.0/8 } real_acl

# --- regression: undefined-reference diagnostics (Tier 3 Task 2) ---

backend diag_ok_backend
  mode http
  server diag_ok_srv 10.0.10.1:80

frontend diag_undef_refs_caller
  bind *:9993
  mode http
  acl diag_defined_acl hdr(x-d) foo
  use_backend diag_missing_backend if diag_defined_acl
  default_backend diag_missing_backend2
  use_backend diag_ok_backend if diag_missing_acl

backend diag_undef_server_backend
  mode http
  server diag_real_srv 10.0.9.1:80
  use_server diag_missing_srv if TRUE
