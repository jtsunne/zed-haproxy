    # end of DO-39214

    # DO-29625 sms-gateway
    use_backend sms-gateway if integration-ecentria-com sms-telnyx
    use_backend sms-gateway if integration-ecentria-com sms-attentive
    # DO-29625 sms-gateway END

    # DO-45738
    http-request deny if !corporate_wan_ipsx checkoutW_path

    http-request set-var(txn.store) req.hdr(Host),map(/etc/haproxy/domain_map.lst)

    # DO-54196/DO-54220 Tactical Store /checkout/ -> Checkout Web (except /checkout/update-quantity and /checkout/item_storage which stay on eCORE CART)
    http-request set-header Host checkout-web.ecentria.tools if www-tacticalstore-com checkout_path !checkout-assets !checkout-api !checkout-update-quantity !checkout-item-storage
    http-request set-path %[path,regsub(^/checkout/,/,)] if { hdr(host) -i checkout-web.ecentria.tools } checkout_path !checkout-assets !checkout-api !checkout-update-quantity !checkout-item-storage

    http-request set-header Host checkout-web.ecentria.tools if checkout-assets || checkoutW_path
    http-request set-path %[path,regsub(^/checkout/assets/,/assets/,)] if checkout-assets
    http-request set-path %[path,regsub(^/checkoutW/,/,)] if checkoutW_path
    acl checkout-assets-host hdr(host) -i checkout-web.ecentria.tools

    http-request set-header Host checkout-api.ecentria.tools if checkout-api
    http-request set-path %[path,regsub(^/checkout/api/,/api/,)] if checkout-api
    acl checkout-api-host hdr(host) -i checkout-api.ecentria.tools

    http-request add-header Cookie store="%[var(txn.store)]" if checkout-api-host

    use_backend eks-nodes-alb if checkout-assets-host || checkout-api-host
    # end DO-45738

    use_backend varnish if gatling-tests
    use_backend varnish if bypass-human

    acl human_is_down nbsrv(human) lt 1

    # App Attribution serve without www for opticsplanet.com
    use_backend varnish if without-www-opticsplanet-com appattribution-url

    ### shop.op.com (has to be ABOVE sub-op)
    use_backend varnish if human_is_down host-shop-opticsplanet
    use_backend human if host-shop-opticsplanet

    use_backend opticsplanet-salamanca if host-feedback || host-rma
    use_backend wp-gearexpert if www-gearexpert-com
    use_backend opcart-direct if host-op-net

    use_backend varnish if human_is_down employee-opticsplanet-net
    use_backend human if employee-opticsplanet-net
    use_backend varnish if human_is_down non-www-domains s-digit
    use_backend human if non-www-domains s-digit

    # careful about moving these; consider how you want layout and images handled
    use_backend ecentria-web-backend if layout-secure
    use_backend eks-nodes-alb-media-service if shop-images-prefix www-shop-domains
    # careful about moving above; consider how you want layout and images handled

    # newsletters override for eyewearplanet goes to salamanca
