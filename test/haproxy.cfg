    use_backend opticsplanet-salamanca if forum-opticsplanet-com
    # Salamanca is used for .com if only one of the folders match
    use_backend opticsplanet-salamanca if www-opticsplanet-com salamanca-folders
    # cart backend is used for everything else that does not match folders (like /checkout/).

    use_backend varnish if human_is_down host-dvor
    use_backend varnish if human_is_down host-dvor-net
    use_backend varnish if human_is_down host-preview-dvor
    use_backend varnish if human_is_down www-campsaver-com
    use_backend varnish if human_is_down host-op-net-layout
    use_backend varnish if human_is_down www-opticsplanet-com
    use_backend varnish if human_is_down www-eyewearplanet-com
    use_backend varnish if human_is_down www-shoptics-com
    use_backend varnish if human_is_down www-microscopes-com
    use_backend varnish if human_is_down www-radarguns-com
    use_backend varnish if human_is_down www-night-optics-com
    use_backend varnish if human_is_down www-labplanet-com
    use_backend varnish if human_is_down www-opticsforyou-com
    use_backend varnish if human_is_down www-guncases-com
    use_backend varnish if human_is_down www-rangefinders-com
    use_backend varnish if human_is_down www-tacticalstore-com
    use_backend varnish if human_is_down www-umledirect-com
    use_backend human if host-dvor || host-dvor-net || host-preview-dvor || www-campsaver-com || host-op-net-layout || www-opticsplanet-com || www-eyewearplanet-com || www-shoptics-com || www-microscopes-com || www-radarguns-com || www-night-optics-com || www-labplanet-com || www-opticsforyou-com || www-guncases-com || www-rangefinders-com || www-tacticalstore-com || www-umledirect-com
    # For now, ArmaBear goes to varnish directly
    use_backend varnish if www-armabear-com
    use_backend varnish if host-shop-armabear
    # salamanca for everything else
    use_backend opticsplanet-salamanca if sub-opticsplanet-com
    # mobile-apps testing to salamanca directly
    use_backend opticsplanet-salamanca if host-mobile-apps

    default_backend             opcart-direct

listen stats
    bind *:8080
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable

listen stats-admin
    bind *:8081
    stats enable
    stats auth ha-stats:N6q8wVJDmEd0
    stats admin if TRUE

#---------------------------------------------------------------------
# round robin balancing between the various backends
