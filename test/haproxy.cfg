backend human
    http-response set-header X-Content-Type-Options nosniff
    errorfile 400 /etc/haproxy/errorfiles/opticsplanet-400-error.http
    errorfile 500 /etc/haproxy/errorfiles/opticsplanet-500-error.http
    errorfile 502 /etc/haproxy/errorfiles/opticsplanet-502-error.http
    errorfile 503 /etc/haproxy/errorfiles/opticsplanet-503-error.http
    errorfile 504 /etc/haproxy/errorfiles/opticsplanet-504-error.http
    balance roundrobin
    option httpchk GET /
    option allbackups
    # 10 nodes * 64 maxconn / 2 human nodes = 320
    server haproxy-external-human-1 haproxy-external-human-1.h.ecentria.com:80 check maxconn 320 disabled
    server haproxy-external-human-2 haproxy-external-human-2.h.ecentria.com:80 check maxconn 320

backend varnish
