global
    log          127.0.0.1:514 len 20480 local2
    chroot       /var/lib/haproxy
    pidfile      /var/run/haproxy.pid
    maxconn      4000
    tune.bufsize 256000
    user         haproxy
    group        haproxy
    daemon
    stats socket /var/lib/haproxy/stats level admin user haproxy
    stats socket /var/lib/haproxy/stats.sock mode 666 level admin
    stats socket ipv4@0.0.0.0:8282 level admin
    tune.ssl.default-dh-param 2048

    ssl-default-bind-options ssl-min-ver TLSv1.1
    ssl-default-bind-ciphers ECDH+AESGCM:!DH+AESGCM:ECDH+AES256:!DH+AES256:!ECDH+AES128:!DH+AES:RSA+AESGCM:RSA+AES:!aNULL:!MD5:!DSS

    ssl-default-server-options ssl-min-ver TLSv1.1
    ssl-default-server-ciphers ECDH+AESGCM:!DH+AESGCM:ECDH+AES256:!DH+AES256:!ECDH+AES128:!DH+AES:RSA+AESGCM:RSA+AES:!aNULL:!MD5:!DSS


#---------------------------------------------------------------------
# common defaults that all the 'listen' and 'backend' sections will
# use if not designated in their block
#---------------------------------------------------------------------
defaults
    mode                    http
    log                     global
    option                  dontlognull
    option http-server-close
    option                  redispatch
    retries                 3
    timeout http-request    1m
    timeout queue           1m
    timeout connect         10s
    timeout client          1m
    timeout server          1m
    timeout http-keep-alive 10s
    timeout check           10s
    maxconn                 3000

frontend http-vportal
    bind *:8020

    timeout http-request    10m
    timeout client          10m

    tcp-request inspect-delay 5s

    # BEGIN Rate limit for login
    acl vportal-login-url path_reg -i ^/login.*$
    tcp-request content track-sc0 hdr_ip(X-Forwarded-For,1) table st_vportal_login if vportal-login-url
    # END Rate limit for login

    http-request deny if METH_TRACE
    http-request deny deny_status 429 if { sc_http_req_rate(0,st_vportal_login) gt 30 } vportal-login-url

    # Remove response header
    http-response del-header Server
    http-response del-header X-Powered-By
    option forwardfor

    log-format %{+Q}o\ %{-Q}ci\ -\ -\ [%T]\ %r\ %ST\ %B\ \"\"\ \"\"\ %cp\ %ms\ %ft\ %b\ %s\ %Tq\ %Tw\ %Tc\ %Tr\ %Tt\ %tsc\ %ac\ %fc\ %bc\ %sc\ %rc\ %sq\ %bq\ %CC\ %CS\ %sslv\ %sslc\ %hrl\ %hsl
    capture request  header Host len 100
    capture request  header X-Forwarded-For len 250
    capture request  header Referer len 250
    capture request  header User-agent len 1024
    capture request  header Cookie len 10240
    capture response header Location len 200

    default_backend             ecore-procure-web

backend ecore-procure-web
    balance roundrobin
    option httpchk
    http-response set-header X-Content-Type-Options nosniff
    server ecore-procure-web-1 ecore-procure-web-1.h.ecentria.com:80 check

frontend http-cpanel
    bind *:8046
    option forwardfor

    acl is_proto_http hdr(X-Forwarded-Proto) https
    acl lisbon-pub hdr_end(host) -i lisbon-pub.h.ecentria.com
    http-request redirect scheme https code 301 if !is_proto_http !lisbon-pub

    log-format %{+Q}o\ %{-Q}ci\ -\ -\ [%T]\ %r\ %ST\ %B\ \"\"\ \"\"\ %cp\ %ms\ %ft\ %b\ %s\ %Tq\ %Tw\ %Tc\ %Tr\ %Tt\ %tsc\ %ac\ %fc\ %bc\ %sc\ %rc\ %sq\ %bq\ %CC\ %CS\ %sslv\ %sslc\ %hrl\ %hsl
    capture request  header Host len 100
    capture request  header X-Forwarded-For len 250
    capture request  header Referer len 250
    capture request  header User-agent len 1024
    capture request  header Cookie len 10240
    capture response header Location len 200

    default_backend             cpanel

backend cpanel
    balance roundrobin
    option httpchk GET /
    http-check expect status 200
    http-response set-header X-Content-Type-Options nosniff
    server common-cpanel-1-web common-cpanel-1-web.h.ecentria.com:80 check

frontend subdomin-redirect
    bind *:8002

    acl subdom-m hdr_beg(host) -i m.
    acl subdom-rma hdr_beg(host) -i rma.
    acl subdom-feedback hdr_beg(host) -i feedback.

    acl found-from path_reg -i ^/form/(.*)?$
    acl url-best path_reg -i ^/form/fullsize/best_price(/.*)?$
    acl url-price path_reg -i ^/form/fullsize/price_quote(/.*)?$
    acl url-call path_reg -i ^/form/fullsize/call_to_order(/.*)?$
    acl url-ask path_reg -i ^/form/fullsize/ask_an_expert(/.*)?$
    acl url-deal path_reg -i ^/form/fullsize/deal_request(/.*)?$
    acl url-unavailable path_reg -i ^/form/fullsize/unavailable_product(/.*)?$

    http-request set-var(req.rewrite_host) req.hdr(host),lower,regsub(^m\.,www.) if subdom-m
    http-request set-var(req.rewrite_host) req.hdr(host),lower,regsub(^rma\.,www.) if subdom-rma
    http-request set-var(req.rewrite_host) req.hdr(host),lower,regsub(^feedback\.,www.) if subdom-feedback

    http-request set-path /rma if subdom-rma
    http-request redirect code 301 location https://%[var(req.rewrite_host)]%[path] if subdom-m
    http-request redirect code 301 location https://%[var(req.rewrite_host)]%[path] if subdom-rma

    http-request redirect code 301 location https://%[var(req.rewrite_host)]/contact-us/best_price if subdom-feedback url-best
    http-request redirect code 301 location https://%[var(req.rewrite_host)]/contact-us/price_quote if subdom-feedback url-price
    http-request redirect code 301 location https://%[var(req.rewrite_host)]/contact-us/call_to_order if subdom-feedback url-call
    http-request redirect code 301 location https://%[var(req.rewrite_host)]/contact-us/ask-an-expert if subdom-feedback url-ask
    http-request redirect code 301 location https://%[var(req.rewrite_host)]/contact-us/deal_request if subdom-feedback url-deal
    http-request redirect code 301 location https://%[var(req.rewrite_host)]/contact-us/unavailable_product if subdom-feedback url-unavailable
    http-request redirect code 301 location https://%[var(req.rewrite_host)]/contact-us if subdom-feedback !found-from

backend st_src_bot
    stick-table type ip size 100k expire 3s store gpc0_rate(3s)

backend st_good_bot
    stick-table type ip size 100k expire 1s store gpc0_rate(1s)

backend st_llm_crawlers
    stick-table type ip size 100k expire 1s store gpc0_rate(1s)

backend st_fastly_cdn
    stick-table type ip size 100k expire 1s store gpc0_rate(1s)

backend st_semrush
    stick-table type ip size 100k expire 1s store gpc0_rate(1s)

backend st_signin
    stick-table type ip size 100k expire 5s store gpc0_rate(5s)

backend st_my_account
    stick-table type ip size 100k expire 60s store gpc0_rate(60s)

backend st_checkout
    stick-table type ip size 100k expire 60s store gpc0_rate(60s)

backend st_customer_key
    # 30s because we have 2 HAproxy's with round robin
    stick-table type string len 100 size 100k expire 30s store gpc0_rate(30s)

backend st_login_check
    stick-table type ip size 100k expire 120s store gpc0_rate(120s)

backend st_nelmio
    stick-table type ip size 100k expire 3600s store http_req_rate(60s)

backend st_fast_ip
    stick-table type ip size 1m expire 60s store http_req_rate(60s)

backend st_xmlrpc
    stick-table type ip size 100k expire 60s store http_req_rate(60s)

backend st_umle_rl
    stick-table type ip size 100k expire 180s store http_req_rate(10s)

backend st-curr-cnt
    stick-table type string size 100K expire 1s store http_req_rate(1s)

backend st-promo-cnt
    stick-table type string len 256 size 100K expire 10s store http_req_rate(10s)

backend st_shipping
    stick-table type ip size 1m expire 60s store http_req_rate(60s)

backend st_vportal_login
    stick-table type ip size 100k expire 60s store http_req_rate(60s)

frontend  http-lb
    bind *:80
    bind *:8001

    # This is required, because campsaver does internal HTTPS requests to its own domain.
    # Talk to KT before touching this [2016-10-26]
    bind *:443 ssl crt /etc/ssl/haproxy/campsaver.com.pem ssl-min-ver TLSv1.1

    # To make sure X-Forwarded-For is not spoofed, we also need to delete this header from request,
    # unless it's coming from Edgecast
    option forwardfor if-none

    tcp-request inspect-delay 5s

    acl googlebot hdr_sub(User-Agent) Googlebot

    acl trusted-proxies-ips src -f /etc/haproxy/trusted-proxies.cfg
    acl corporate_wan_ipsx hdr_ip(x-forwarded-for) -f /etc/haproxy/corporate-wan.cfg
    acl corporate_lan_ipsx hdr_ip(x-forwarded-for) -f /etc/haproxy/corporate-lan.cfg

    # Block signin if there are too many requests within the last 10 minutes
    acl too-many-sign-ins-by-useragent sc0_gpc0_rate() gt 10
    acl too-many-full-contact-form sc0_gpc0_rate() gt 15
    acl abuser-seen sc0_inc_gpc0 gt 0
    acl facebook-login path_reg -i ^/api/0.\d/customer/facebook.*
    # block multiple subscriptions attempt as well
    acl subscription path_reg -i ^/api/0.\d/customer/newsletter-subscription.*$

    # block gift certificates as well
    acl gift-certificate path_reg -i ^/checkout/gift-certificate.*$
    acl checkout-assets path_reg -i ^/checkout/assets.*$
    acl checkoutW_path path_beg /checkoutW/
    acl checkout-api path_reg -i ^/checkout/api.*$
    acl checkout_path path_beg /checkout/
    # DO-54196 Temporary exception: /checkout/update-quantity must stay on eCORE CART, not Checkout Web
    acl checkout-update-quantity path_beg /checkout/update-quantity
    # DO-54220 Temporary exception: /checkout/item_storage must stay on eCORE CART, not Checkout Web
    acl checkout-item-storage path_beg /checkout/item_storage

    # block full-contact-form
    acl full-contact-form path_reg -i ^/api/0.\d/forms/full-contact-form.*$

    stick-table type ip size 10k expire 600s store gpc0_rate(600s)

    acl bad-usr-agents-bots-file req.fhdr(user-agent) -m sub -i -f /etc/haproxy/limited-useragents.cfg
    acl aws-bad-usragnt-bots-file req.fhdr(user-agent) -m sub -f /etc/haproxy/aws-useragents.cfg
    acl too-many-bots sc0_gpc0_rate(st_src_bot) gt 3

    tcp-request content track-sc0 hdr_ip(X-Forwarded-For,1) table st_src_bot if bad-usr-agents-bots-file

    # Good bots
    acl good-usr-agents-bots-file req.fhdr(user-agent) -m sub -i -f /etc/haproxy/good-limited-useragents.cfg
    acl too-many-good-bots sc0_gpc0_rate(st_good_bot) gt 15

    tcp-request content track-sc0 hdr_ip(X-Forwarded-For,1) table st_good_bot if good-usr-agents-bots-file
    # Good bots END

    # LLM crawlers - allowed with rate limit of 100 req/sec per IP
    acl llm-crawlers-ips hdr_ip(x-forwarded-for,1) -f /etc/haproxy/llm-crawlers-ips.cfg
    acl too-many-llm-crawlers sc0_gpc0_rate(st_llm_crawlers) gt 100
    tcp-request content track-sc0 hdr_ip(X-Forwarded-For,1) table st_llm_crawlers if llm-crawlers-ips
    # LLM crawlers END

    # Fastly CDN - allowed with rate limit of 5 req/sec per IP
    acl fastly-cdn-ips hdr_ip(x-forwarded-for,1) -f /etc/haproxy/fastly-ips.cfg
    acl too-many-fastly-cdn sc0_gpc0_rate(st_fastly_cdn) gt 5
    tcp-request content track-sc0 hdr_ip(X-Forwarded-For,1) table st_fastly_cdn if fastly-cdn-ips
    # Fastly CDN END

    # SEMrush - allowed with rate limit of 15 req/sec per IP
    acl semrush-ips hdr_ip(x-forwarded-for,1) -f /etc/haproxy/semrush-ips.cfg
    acl too-many-semrush sc0_gpc0_rate(st_semrush) gt 15
    tcp-request content track-sc0 hdr_ip(X-Forwarded-For,1) table st_semrush if semrush-ips
    # SEMrush END

    # BEGIN Rate limit for SignIn
    acl signin_url path_reg -i ^/signin.*$
    acl too-many-signin sc0_gpc0_rate(st_signin) gt 10
    tcp-request content track-sc0 hdr_ip(X-Forwarded-For,1) table st_signin if signin_url
    # END Rate limit for SignIn

    # BEGIN Rate limit for /my-account excluding login_check
    acl my_account_url path_reg -i ^/my-account(?!/login_check).*$
    acl too-many-my-account sc0_gpc0_rate(st_my_account) gt 50
    tcp-request content track-sc0 hdr_ip(X-Forwarded-For,1) table st_my_account if my_account_url
    # END Rate limit for /my-account

    # BEGIN Rate limit for /checkout excluding shipping-options and gift-certificate
    acl checkout_url path_reg -i ^/checkout(?!/(shipping-options|gift-certificate)).*$
    acl too-many-checkout sc0_gpc0_rate(st_checkout) gt 50
    tcp-request content track-sc0 hdr_ip(X-Forwarded-For,1) table st_checkout if checkout_url
    # END Rate limit for /checkout

    # BEGIN Rate limit for login-check
    acl login-check path_reg -i ^/my-account/login_check.*$
    acl too-many-login-check sc0_gpc0_rate(st_login_check) gt 20
    tcp-request content track-sc0 hdr_ip(X-Forwarded-For,1) table st_login_check if trusted-proxies-ips login-check
    tcp-request content track-sc0 src table st_login_check if !trusted-proxies-ips login-check
    # END Rate limit for login-check

    # BEGIN Rate limit for /api/0.x/customer/key
    acl customer_key_url path_reg -i ^/api/0.\d/customer/key.*$
    acl too-many-key sc0_gpc0_rate(st_customer_key) gt 5
    tcp-request content track-sc0 req.fhdr(user-agent) table st_customer_key if customer_key_url
    # END Rate limit for /api/0.x/customer/key

    # BEGIN DO-26673
    acl nelmio-logger path_reg -i ^/nelmio-js-logger/log.*$
    tcp-request content track-sc0 hdr_ip(X-Forwarded-For,1) table st_nelmio if nelmio-logger
    # END DO-26673

    # BEGIN DO-26717
    acl xml-rpc path_reg -i ^/xmlrpc.php.*$
    tcp-request content track-sc0 hdr_ip(X-Forwarded-For,1) table st_xmlrpc if xml-rpc
    # END DO-26717

    # BEGIN DO-34309
    acl shipping_options path_reg -i ^/checkout/shipping-options.*$
    tcp-request content track-sc0 hdr_ip(x-forwarded-for,1) table st_shipping if shipping_options
    # END DO-34309

    # BEGIN DO-29568
    tcp-request content track-sc0 hdr_ip(X-Forwarded-For,1) table st_fast_ip if !corporate_wan_ipsx !llm-crawlers-ips !fastly-cdn-ips !semrush-ips
    # END DO-29568

    # for edgecast, use forwarded header
    tcp-request content track-sc0 hdr_ip(X-Forwarded-For,1) if trusted-proxies-ips facebook-login or subscription or gift-certificate or full-contact-form

    # for non-edgecast, use originating IP
    tcp-request content track-sc0 src if !trusted-proxies-ips facebook-login or subscription or gift-certificate or full-contact-form

    acl www-campsaver-com hdr_end(host) -i campsaver.com
    acl www-umledirect-com hdr_end(host) -i umledirect.com
    acl path-forbidden path_reg -i ^/forbidden.html.*$

    http-request track-sc0 hdr_ip(x-forwarded-for,1) table st_umle_rl if www-umledirect-com
    http-request redirect code 307 location https://umle-ha-experiment.s3.us-east-2.amazonaws.com/index.html if www-umledirect-com { table_cnt(st_umle_rl) gt 50 } corporate_wan_ipsx

    acl is-user-agent-has-device hdr_sub(user-agent) -i _device_

    acl host-in-scan-subnet hdr_ip(x-forwarded-for) -f /etc/haproxy/scan-subnets.cfg

    acl aws-subnet hdr_ip(x-forwarded-for,1) -f /etc/haproxy/aws.cfg
    acl aws-allowed req.hdr_ip(x-forwarded-for,1) -f /etc/haproxy/aws-allowed-ips.cfg

    # DO-36377 for eCore CART gatling tests
    acl gatling-tests hdr_ip(x-forwarded-for) 18.188.171.104

    # abuser-seen needs to be evaluated only once
    http-request set-log-level silent if { sc_http_req_rate(0,st_xmlrpc) gt 5 } xml-rpc
    http-request deny deny_status 429 if { sc_http_req_rate(0,st_xmlrpc) gt 5 } xml-rpc !gatling-tests
    # http-request set-log-level silent if { sc_http_req_rate(0,st_nelmio) gt 50 } nelmio-logger
    http-request set-log-level silent if nelmio-logger
    http-request deny deny_status 429 if { sc_http_req_rate(0,st_nelmio) gt 50 } nelmio-logger !gatling-tests
    http-request deny deny_status 429 if { sc_http_req_rate(0,st_shipping) gt 10 } shipping_options !gatling-tests


    # limit request rate to 30 per IP address in each scan subnet
    http-request deny deny_status 429 if { sc_http_req_rate(0,st_fast_ip) gt 6 } host-in-scan-subnet !gatling-tests
    http-request deny deny_status 429 if { sc_http_req_rate(0,st_fast_ip) gt 40 } aws-subnet !aws-allowed !gatling-tests
    http-request deny deny_status 429 if { sc_http_req_rate(0,st_fast_ip) gt 15 } aws-subnet www-campsaver-com !aws-allowed !gatling-tests
    http-request deny deny_status 429 if { sc_http_req_rate(0,st_fast_ip) gt 3 } aws-subnet www-campsaver-com aws-bad-usragnt-bots-file !aws-allowed !gatling-tests
    http-request deny deny_status 429 if { sc_http_req_rate(0,st_fast_ip) gt 1000 } !gatling-tests
    http-request deny deny_status 429 if good-usr-agents-bots-file too-many-good-bots !gatling-tests
    http-request deny deny_status 429 if llm-crawlers-ips too-many-llm-crawlers !gatling-tests
    http-request deny deny_status 429 if fastly-cdn-ips too-many-fastly-cdn !gatling-tests
    http-request deny deny_status 429 if semrush-ips too-many-semrush !gatling-tests
    http-request deny deny_status 429 if login-check too-many-login-check !gatling-tests
    http-request deny if customer_key_url !is-user-agent-has-device !gatling-tests
    http-request deny if signin_url too-many-signin !gatling-tests
    http-request deny deny_status 429 if my_account_url too-many-my-account !gatling-tests
    http-request deny deny_status 429 if checkout_url too-many-checkout !gatling-tests
    http-request deny if customer_key_url too-many-key !gatling-tests
    http-request deny if abuser-seen too-many-sign-ins-by-useragent !full-contact-form !gatling-tests
    http-request deny if too-many-full-contact-form full-contact-form !gatling-tests
    http-request deny if bad-usr-agents-bots-file too-many-bots !gatling-tests

    acl hacker-deleted-customer hdr_sub(Cookie) customer=deleted
    http-request deny if hacker-deleted-customer login-check !gatling-tests
    acl hacker-campsaver-cart-ddos-cookie hdr(Cookie) -m found
    http-request deny if !hacker-campsaver-cart-ddos-cookie login-check !gatling-tests
    ### END BLOCK LOGIN ABUSERS

    # ACT-Ebay-Notification-Service
    acl act-ebay-notification-service hdr(host) -i act-ebay-notification-service-op-public.ecentria.tools
    acl act-ebay-notification-service hdr(host) -i act-ebay-notification-service-cs-public.ecentria.tools
    acl act-ebay-notification-service hdr(host) -i act-ebay-notification-service-edemo-public.ecentria.tools

    # BigCommerce ACLs
    acl big-commerce-ips hdr_ip(x-forwarded-for) -f /etc/haproxy/bigcommerce-ips.cfg
    acl tax-api-internal-host hdr(host) -i tax-api-public.ecentria.tools
    acl big-commerce-uri path_reg -i ^/bigcommerce/+.*$

    # Block bad IPs and user agents
    acl bad-ips-from-file hdr_ip(x-forwarded-for) -f /etc/haproxy/block-ips.cfg
    acl bad-user-agents-file req.fhdr(user-agent) -m sub -f /etc/haproxy/block-useragents.cfg
    http-request deny if bad-ips-from-file or bad-user-agents-file !gatling-tests

    http-request deny if METH_TRACE

    # TODO: Check back later. Unused
    # Reuse the same file for corporate IPs as in other sections
    # acl corporate_wan_ips src -f /etc/haproxy/corporate-wan.cfg

    # Remove response header
    http-response del-header Server
    http-response del-header X-Powered-By

    acl url-shortener hdr_end(host) -i e.op.ht e.0ps.us op.0ps.us dv.0ps.us click.campsaver.com tap.dvor.com tap.armabear.com click.opticsplanet.com
    acl restrict-api-url-shortener path_reg -i ^/+api(/+.*)?$
    acl apple-app-site-association-url path_reg -i ^(/.well-known/apple-app-site-association|/apple-app-site-association)$
    acl assetlinks-url path_reg -i ^/.well-known/assetlinks.json$
    acl appattribution-url path_reg -i ^/.well-known/appattribution/report-attribution(/.*)?$

    # DO-24548
    acl apple-developer-association-url path_reg -i ^/.well-known/apple-developer-merchantid-domain-association$

    # DO-39214, temporary disabled deeplinks to mobile app
    acl webmanifest-url path_reg -i ^/manifest.webmanifest.json$

    acl public-files-url-shortener path_reg -i ^(/robots.txt|/favicon.ico|/apple-touch-icon-precomposed.png|/apple-touch-icon.png|/apple-touch-icon-57x57.png|/apple-touch-icon-57x57-precomposed.png)$
    acl subscription-url-shortener path_reg -i ^/s/[a-z]+/[a-zA-Z0-9_-]+/[\w]+$
    acl pdata-url-shortener path_reg -i ^/[a-z0-9_]+/[0-9-]+/[a-z0-9]$
    acl encoded-media-id-url-shortener path_reg -i ^/[a-z0-9\_]+/[a-z0-9]+/[a-z0-9]$
    acl placement-url-shortener path_reg -i ^/[\w]+/(b|t|bpng|tpng|b\.png|t\.png)$
    acl pixel-with-redirect-url-shortener path_reg -i ^/[\w]+/r/[\-\w]+$
    acl dynamic-slug-url-shortener path_reg -i ^/d/[a-z0-9\_\-]+$
    acl slug-url-shortener path_reg -i ^/[a-z0-9\_]+$
    http-request deny if url-shortener restrict-api-url-shortener or url-shortener !apple-app-site-association-url !public-files-url-shortener !subscription-url-shortener !pdata-url-shortener !encoded-media-id-url-shortener !placement-url-shortener !pixel-with-redirect-url-shortener !dynamic-slug-url-shortener !slug-url-shortener !assetlinks-url

    acl employee-opticsplanet-net hdr(host) -i employee.opticsplanet.net
    http-request deny if !corporate_lan_ipsx employee-opticsplanet-net

    acl ringcentral-ips hdr_ip(X-Forwarded-For) -f /etc/haproxy/ringcentral-ips.cfg
    acl api-external-ecentria-com hdr(host) -i api-external.ecentria.com
    acl ring-central path_reg -i ^/ring-central(/+.*)?$
    http-request deny if !ring-central api-external-ecentria-com
    http-request deny if !ringcentral-ips !corporate_wan_ipsx api-external-ecentria-com

    # DO-21651
    acl map-file path_reg -i \.map$
    http-request deny if !corporate_wan_ipsx map-file
    # end DO-21651

