frontend ecentria-web
    bind *:8030

    # To make sure X-Forwarded-For is not spoofed, we also need to delete this header from request
    option forwardfor if-none
    acl trusted-proxies-ips src -f /etc/haproxy/trusted-proxies.cfg

    http-request del-header X-Proto if !trusted-proxies-ips
    http-request del-header X-Forwarded-For if !trusted-proxies-ips
    http-request del-header X-Forwarded-Proto if !trusted-proxies-ips
    http-request del-header X-Forwarded-Port if !trusted-proxies-ips
    http-request del-header Forwarded if !trusted-proxies-ips

    # Remove headers for security reason
    http-response del-header Server
    http-response del-header X-Powered-By

    http-request set-header X-Proto SSL if { ssl_fc }
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Port 443 if { ssl_fc }

    # Redirect if not going through https
    acl is_proto_https hdr(X-Forwarded-Proto) https
    http-request redirect scheme https code 301 if !is_proto_https
    http-response set-header Strict-Transport-Security "max-age=86400"
    log-format %{+Q}o\ %{-Q}ci\ -\ -\ [%T]\ %r\ %ST\ %B\ \"\"\ \"\"\ %cp\ %ms\ %ft\ %b\ %s\ %Tq\ %Tw\ %Tc\ %Tr\ %Tt\ %tsc\ %ac\ %fc\ %bc\ %sc\ %rc\ %sq\ %bq\ %CC\ %CS\ %sslv\ %sslc\ %hrl\ %hsl
    capture request  header Host len 100
    capture request  header X-Forwarded-For len 250
    capture request  header Referer len 250
    capture request  header User-agent len 1024
    capture request  header Cookie len 10240
    capture response header Location len 200

    default_backend ecentria-web-backend

backend ecentria-web-backend
    balance roundrobin
    option httpchk
    http-response set-header X-Content-Type-Options nosniff
    server layouts-aws-1 layouts-aws-1.h.ecentria.com:80 check

