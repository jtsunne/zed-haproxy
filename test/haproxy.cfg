    errorfile 503 /etc/haproxy/errorfiles/opticsplanet-503-error.http
    errorfile 504 /etc/haproxy/errorfiles/opticsplanet-504-error.http
    balance roundrobin
    option httpchk GET /
    option allbackups
    # 10 nodes * 64 maxconn / 2 haproxy = 320
    server cart-varnish-aws-1 cart-varnish-aws-1.h.ecentria.com:80 check maxconn 320
    server cart-varnish-aws-2 cart-varnish-aws-2.h.ecentria.com:80 check maxconn 320 disabled
    server cart-node-php73-aws-1 cart-node-php73-aws-1.h.ecentria.com:80 check backup port 18189 maxconn 32
    server cart-node-php73-aws-2 cart-node-php73-aws-2.h.ecentria.com:80 check backup port 18189 maxconn 32
    server cart-node-php73-aws-3 cart-node-php73-aws-3.h.ecentria.com:80 check backup port 18189 maxconn 32
    server cart-node-php73-aws-4 cart-node-php73-aws-4.h.ecentria.com:80 check backup port 18189 maxconn 32
